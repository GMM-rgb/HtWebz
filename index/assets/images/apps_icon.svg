<svg class="grid-icon" width="50" height="50" viewBox="0 0 200 200">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#82cfff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#4da6ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#2a5d9f" rx="20" />

  <!-- Grid -->
  <g id="grid">
    <rect class="tile" x="20" y="20" width="50" height="50" rx="6" fill="url(#grad1)" />
    <rect class="tile" x="75" y="20" width="50" height="50" rx="6" fill="#4da6ff" />
    <rect class="tile" x="130" y="20" width="50" height="50" rx="6" fill="url(#grad2)" />

    <rect class="tile" x="20" y="75" width="50" height="50" rx="6" fill="#82cfff" />
    <rect class="tile" x="75" y="75" width="50" height="50" rx="6" fill="url(#grad1)" />
    <rect class="tile" x="130" y="75" width="50" height="50" rx="6" fill="#1a73e8" />

    <rect class="tile" x="20" y="130" width="50" height="50" rx="6" fill="url(#grad2)" />
    <rect class="tile" x="75" y="130" width="50" height="50" rx="6" fill="#4da6ff" />
    <rect class="tile" x="130" y="130" width="50" height="50" rx="6" fill="url(#grad1)" />
  </g>

  <!-- Folded corner -->
  <polygon points="180,180 130,180 180,130" fill="white" opacity="0.9"/>
</svg>

<style>
  .tile {
    transition: all 0.175s ease;
  }

  .grid-icon {
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .grid-icon:hover .tile {
    filter: brightness(1.25);
  }

  .grid-icon:active .tile {
    filter: brightness(0.9);
  }

  .grid-icon:hover {
    transform: scale(1.025);
  }

  .grid-icon:active {
    transform: scale(0.975);
  }
</style>
