<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="shortcut icon" type="x-icon" href="assets/images/HtDocs_App_icon.png" style="border-radius: 10px;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HtEditor - Text Editor</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: black;
            margin: 0;
            padding: 10px;
            background-color: rgb(204, 204, 204); /* Light background color for the body */
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            overflow: hidden;
            height: 100vh;
        }

        .title {
            -webkit-text-fill-color: cyan;
            -webkit-stroke: 4px darkcyan;
            stroke: 4px darkcyan;
            color: black;
            /* Prevents selections */
            user-select: none;
            -webkit-user-select: none;
        }

        .editor-container {
            position: relative;
            flex: 1 1 auto;
            min-width: 280px;
            width: calc(100vw - 195px);
            height: calc(100vh - 20px);
            margin-left: 175px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 15px; /* Rounded corners for the container */
            background: whitesmoke;
            padding: 20px;
            padding-top: 60px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1), inset 0 0 15px rgba(0, 0, 0, 0.75); /* Subtle shadow for depth */
            color: black;
            z-index: 1;
            box-sizing: border-box;
        }

        .editor-container::-webkit-scrollbar {
            display: none; /* Hide the scrollbar for a cleaner look */
        }

        #titleContainer {
            position: fixed;
            top: 10px;
            left: 185px;
            right: 10px;
            background: whitesmoke;
            padding: 15px;
            border-radius: 15px;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1), inset 0 0 15px rgba(0, 0, 0, 0.75); /* Subtle shadow for depth */
        }

        #fileName {
            width: calc(100% - 200px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
            position: relative;
            z-index: 3;
        }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .toolbar button {
            padding: 10px;
            margin-right: 5px;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            text-rendering: optimizeSpeed !important; /* Ensure text is rendered quickly */
        }

        .toolbar button.bold {
            background-color: #007bff;
            font-weight: bold;
        }

        .bold {
            -webkit-color: white !important; /* Fallback for other browsers */
            color: white !important; /* Ensure text is white for visibility */
        }

        .toolbar button.underline {
            background-color: #dc3545;
            -webkit-color: white !important; /* Fallback for other browsers */
            color: white !important; /* Ensure text is white for visibility */
            font-weight: bold;
        }

        .toolbar .highlight-dropdown {
            position: relative;
            display: inline-block;
        }

        .toolbar .highlight-dropdown-content {
            display: none;
            flex-direction: grid; /* Use grid layout for color boxes */
            grid-template-columns: repeat(3, minmax(25px, 2fr)); /* Responsive grid for color boxes */
            padding: 10px;
            position: absolute;
            background-color: #f9f9f9;
            border-radius: 5px;
            z-index: 1000;
            gap: 4px;
        }

        .toolbar .highlight-dropdown-content .color-box {
            padding: 10px;
            width: 20px;
            height: 20px;
            display: inline-block;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box !important;
            transition: all 0.3s ease-out;
        }

        .color-box:hover {
            box-shadow: inset 0px 8px 16px 0px rgba(0, 0, 0, 0.2), 0px 8px 16px 2px rgba(0, 0, 0, 0.25); /* Subtle inner shadow for depth */
            transform: scale(1.275); /* Slightly increase size on hover for better visibility */
        }

        .toolbar .highlight-dropdown-content .color-box:hover {
            border: 1px solid #555;
        }

        #content {
            flex: 1 1 auto;
            overflow-y: auto;
            min-height: 100px;
            width: 100%;
            padding: 10px;
            margin: 0;
            margin-top: 105px;
            margin-bottom: 5px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #e8fdff;
            word-break: auto;
            word-spacing: auto;
            mask-composite: auto;
            text-rendering: optimizeSpeed !important;
            text-anchor: middle;
            white-space: pre-wrap !important;
            /* For preserving whitespace in content */
            height: auto;
            max-height: unset;
            font-size: 16px;
            /* Default font size */
            position: relative;
            z-index: 2;
            box-sizing: border-box;
        }

        #content::-webkit-scrollbar {
            width: 10px;
        }

        #content::-webkit-scrollbar-track {
            background-color: gray;
            border: 2px solid #ccc;
            border-radius: 10px;
            outline: 1px solid #ccc;
            outline-offset: 1px;
        }

        #content::-webkit-scrollbar-thumb {
            cursor: pointer; /* Makes the scrollbar thumb clickable */
            background: linear-gradient(lightgray, lightslategray lightgray);
            border: 2px solid #ccc;
            border-radius: 10px;
            outline: 1px solid #ccc;
            outline-offset: 1px;
        }

        /* Image resizing styles */
        #content img {
            max-width: 100%;
            height: auto;
        }

        #content img.resize-active {
            outline: 2px solid #007bff;
        }

        .resize-handle {
            width: 8px;
            height: 8px;
            background-color: #007bff;
            position: absolute;
            border-radius: 50%;
            pointer-events: all;
            cursor: pointer;
        }

        .resize-handle.nw { top: -4px; left: -4px; cursor: nw-resize; }
        .resize-handle.ne { top: -4px; right: -4px; cursor: ne-resize; }
        .resize-handle.sw { bottom: -4px; left: -4px; cursor: sw-resize; }
        .resize-handle.se { bottom: -4px; right: -4px; cursor: se-resize; }

        .save-btn {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.25s ease-in-out;
        }

        .save-btn:hover {
            background-color: #02c232;
        }

        .cancel-btn {
            background-color: #dc3545;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.25s ease-in-out;
        }

        .cancel-btn:hover {
            background-color: #ff2f2b;
        }

        .font-size-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }

        .font-size-controls input {
            width: 40px;
            text-align: center;
            padding: 5px;
        }

        .font-type-controls {
            display: flex;
            align-items: center;
            position: relative;
        }

        #filesStats {
            border: 3px solid #a7a7a7;
            border-radius: 15px;
            padding: 10px 5px;
            background: rgb(138, 138, 138);
            color: honeydew;
            box-sizing: border-box;
            box-shadow: inset 0 0 12.5px rgba(0, 0, 0, 0.45);
        }

        /* Add styles for the progress indicator and toast notification */
        #savingIndicator {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #007bff;
            color: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            min-width: 200px;
            -webkit-user-select: none !important;
            user-select: none;
            -webkit-user-drag: none !important;
        }

        .save-progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 8px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: white;
            transition: width 0.3s ease-out, background 0.25s linear;
        }

        .progress-bar:hover {
            background: lightgray;
        }

        #toastNotification {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            animation: fadeInOut 3s ease-in-out;
            -webkit-user-select: none !important;
            user-select: none;
            -webkit-user-drag: none !important;
        }

        .image-border-menu {
            position: absolute;
            right: -180px;
            top: 0;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1001;
            width: 160px;
            font-size: 12px;
        }

        .image-border-menu.active {
            display: block !important;
        }

        .border-color-picker {
            width: 100%;
            height: 25px;
            padding: 2px;
            border: 1px solid #ddd;
            border-radius: 3px;
            margin: 4px 0;
        }

        .border-width-control {
            margin: 8px 0 4px 0;
        }

        .border-width-control input {
            width: 50px;
            padding: 2px 4px;
            margin-left: 4px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0;
                transform: scale(0.5);
            }
            10%, 90% {
                opacity: 1;
                transform: scale(1);
                right: 50px;
            }
            22.5%, 90% {
                transform: scale(1.1);
            }
        }

        .sizing-controls-font-type {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        #pageMappingPreview {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 165px;
            background: white;
            z-index: 1000;
            overflow-y: auto;
            max-height: 100vh;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                padding: 10px;
                height: 100%;
                overflow-y: auto;
            }
            
            .editor-container {
                margin-left: 0;
                width: 100%;
                height: auto;
                min-height: 50vh;
                order: 2;
            }
            
            #pageMappingPreview {
                position: relative;
                width: 100%;
                height: 165px;
                order: 1;
            }
            
            #content {
                height: auto;
                min-height: 50vh;
            }

            #titleContainer {
                position: sticky;
                top: 0;
                left: 0;
                right: 0;
                width: auto;
                margin: 0 0 10px 0;
                z-index: 1000;
            }
        }

        @media (min-width: 769px) {
            .editor-container {
                margin-left: 175px;
                height: calc(100vh - 20px);
            }

            #pageMappingPreview {
                position: fixed;
                width: 165px;
                height: calc(100vh - 20px);
            }
            
            #titleContainer {
                position: fixed;
                left: 185px;
                right: 10px;
            }
        }

        .img-wrapper {
            display: inline-block;
            position: relative;
            margin: 5px;
            min-width: 50px;
            min-height: 50px;
        }
        
        .img-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
        }
        
        .img-wrapper .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #007bff;
            border: 2px solid white;
            border-radius: 50%;
            z-index: 1000;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .img-wrapper .resize-handle:hover {
            transform: scale(1.2);
            background: #0056b3;
        }
        
        .img-wrapper .resize-handle.active {
            background: #003380;
            transform: scale(1.3);
        }
        
        .img-wrapper .resize-handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
        .img-wrapper .resize-handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
        .img-wrapper .resize-handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
        .img-wrapper .resize-handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
        
        .image-format-menu {
            position: absolute;
            right: -220px;
            top: 0;
            background: white;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            width: 200px;
            font-size: 12px;
        }
        
        .format-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .format-section label {
            min-width: 80px;
        }
        
        .format-section input[type="number"] {
            width: 60px;
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .format-section input[type="color"] {
            width: 40px;
            height: 24px;
            padding: 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .format-section select {
            width: 100px;
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>

    <link rel="stylesheet" href="assets/stylesheets/toolbar_styles.css">
    <link rel="stylesheet" href="assets/stylesheets/image_formatting.css">
</head>

<body>
    <!-- Add saving indicator and toast notification -->
    <div id="savingIndicator">
        Saving...
        <div class="save-progress">
            <div class="progress-bar"></div>
        </div>
    </div>
    <div id="toastNotification"></div>


    <link rel="stylesheet" href="assets/stylesheets/page_mapping_preview.css">
    <div id="pageMappingPreview">
        <div id="mapPreviewPage"></div>
    </div>


    <div class="editor-container">
        <div id="titleContainer">
            <input type="text" id="fileName" placeholder="Enter file name" autocomplete="off">
            <div class="toolbar">
                <div class="toolbar-group">
                    <button class="save-btn" onclick="debouncedSave()">Save</button>
                    <button class="cancel-btn" onclick="cancel()">Return</button>
                </div>
                
                <div class="toolbar-group">
                    <button class="bold" onclick="formatText('bold')">Bold</button>
                    <button class="underline" onclick="formatText('underline')">Underline</button>
                </div>
                
                <div class="toolbar-group">
                    <div class="highlight-dropdown">
                        <button class="highlight" onclick="toggleHighlightDropdown()">Highlight</button>
                        <div class="highlight-dropdown-content" id="highlightDropdown">
                            <div class="color-box" id="yellow" style="background-color: yellow;" onclick="highlightText('yellow')" onmouseenter="setupTooltip('#yellow', 'Highlight: Yellow')">
                                <span class="tooltip-text" style="display:none;">Yellow</span>
                            </div>
                            <div class="color-box" id="lightgreen" style="background-color: lightgreen;"
                                onclick="highlightText('lightgreen')" onmouseenter="setupTooltip('#lightgreen', 'Highlight: Light-green')"></div>
                            <div class="color-box" id="lightblue" style="background-color: lightblue;"
                                onclick="highlightText('lightblue')" onmouseenter="setupTooltip('#lightblue', 'Highlight: Light-blue')"></div>
                            <div class="color-box" id="bluepurple" style="background-color: rgb(34, 30, 255);"
                                onclick="highlightText('rgb(34, 30, 255)')" onmouseenter="setupTooltip('#bluepurple', 'Highlight: Blue-purple')"></div>
                            <div class="color-box" id="purple" style="background-color: rgb(126, 30, 255);"
                                onclick="highlightText('rgb(126, 30, 255)')" onmouseenter="setupTooltip('#purple', 'Highlight: Purple')"></div>
                            <div class="color-box" id="pink" style="background-color: rgb(248, 95, 248);"
                                onclick="highlightText('rgb(248, 95, 248)')" onmouseenter="setupTooltip('#pink', 'Hightlight: Pink')"></div>
                            <div class="color-box" id="orange" style="background-color: rgb(255, 153, 0);"
                                onclick="highlightText('rgb(255, 153, 0)')" onmouseenter="setupTooltip('#orange', 'Hightlight: Orange')"></div>
                            <div class="color-box" id="red" style="background-color: red;"
                                onclick="highlightText('red')" onmouseenter="setupTooltip('#red', 'Highlight: Red')"></div>
                        </div>
                    </div>
                    <button class="remove-highlight" onclick="removeHighlight()">Remove Highlight</button>
                </div>
                
                <div class="toolbar-group">
                    <div class="font-size-controls">
                        <button onclick="changeFontSize(-1)">-</button>
                        <input type="text" id="fontSize" value="16" readonly>
                        <button onclick="changeFontSize(1)">+</button>
                    </div>
                    
                    <div class="font-type-controls">
                        <button class="font-button-change" id="fontChangeButton">Font: Arial</button>
                        <div id="fontTypeSelectionContainer">
                            <button class="fontButton" id="arialFontButton">Arial</button>
                            <button class="fontButton" id="sansSerifFontButton">Sans Serif</button>
                            <button class="fontButton" id="helveticaFontButton">Helvetica</button>
                            <button class="fontButton" id="timesRomanFontButton">Times New Roman</button>
                            <button class="fontButton" id="">...</button>
                            <button class="fontButton" id="">...</button>
                            <button class="fontButton" id="">...</button>
                            <button class="fontButton" id="">...</button>
                            <button class="fontButton" id="">...</button>
                            <button class="fontButton" id="">...</button>
                            <button class="fontButton" id="">...</button>
                            <button class="fontButton" id="">...</button>
                            <button class="fontButton" id="">...</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="content" contenteditable="true" placeholder="Start typing..." style="outline: none;" onfocus=""></div>
    </div>

    <!-- Formating controls interface -->
    <link rel="stylesheet" href="assets/stylesheets/format_controls.css">
    <section id="formatingControls">
        <div id="formattingControlsHeader" class="formatting-controls-header">
            <button id="closeFormatingControls">X</button>
            <div id="formatingTypes">
                <button id="elementFormatControls" class="format-type-button">Position & Size</button>
                <button id="miscellaneousFormatControls" class="format-type-button">Miscellaneous</button>
            </div>    
        </div>
    </section>

    <!-- Editor functionality -->
    <script>
        let editor;

        document.addEventListener('DOMContentLoaded', function() {
            editor = document.getElementById('content');
            
            // Single consolidated observer
            const observer = new MutationObserver((mutations) => {
                if (!editor.innerHTML) {
                    document.execCommand('insertHTML', false, '<br>');
                }
                if (window.renderPreview) {
                    window.renderPreview();
                }
            });

            observer.observe(editor, {
                childList: true,
                subtree: true,
                characterData: true,
                attributes: true
            });

            // Initialize image handling
            editor.addEventListener('click', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    e.stopPropagation();
                    initImageHandling(e.target);
                }
            });

            function initImageHandling(img) {
                // Remove existing controls
                const allWrappers = editor.querySelectorAll('.img-wrapper');
                allWrappers.forEach(wrapper => {
                    const image = wrapper.querySelector('img');
                    if (image) wrapper.replaceWith(image);
                });
                
                // Create wrapper
                const wrapper = document.createElement('div');
                wrapper.className = 'img-wrapper';
                img.parentNode.insertBefore(wrapper, img);
                wrapper.appendChild(img);

                // Add formatting menu
                const formatMenu = document.createElement('div');
                formatMenu.className = 'image-format-menu';
                formatMenu.innerHTML = `
                    <div class="format-control">
                        <div class="format-section">
                            <label>Border:</label>
                            <input type="number" min="0" max="20" value="${img.style.borderWidth ? parseInt(img.style.borderWidth) : 0}" class="border-width"/>
                            <input type="color" value="${img.style.borderColor || '#000000'}" class="border-color"/>
                        </div>
                        <div class="format-section">
                            <label>Border Style:</label>
                            <select class="border-style">
                                <option value="solid">Solid</option>
                                <option value="dashed">Dashed</option>
                                <option value="dotted">Dotted</option>
                            </select>
                        </div>
                        <div class="format-section">
                            <label>Border Radius:</label>
                            <input type="number" min="0" max="50" value="${img.style.borderRadius ? parseInt(img.style.borderRadius) : 0}" class="border-radius"/>
                        </div>
                    </div>
                `;
                wrapper.appendChild(formatMenu);

                // Add format menu events
                const widthInput = formatMenu.querySelector('.border-width');
                const colorInput = formatMenu.querySelector('.border-color');
                const styleSelect = formatMenu.querySelector('.border-style');
                const radiusInput = formatMenu.querySelector('.border-radius');
                
                function updateImageStyle() {
                    img.style.border = `${widthInput.value}px ${styleSelect.value} ${colorInput.value}`;
                    img.style.borderRadius = `${radiusInput.value}px`;
                    debouncedSave();
                }

                widthInput.addEventListener('input', updateImageStyle);
                colorInput.addEventListener('input', updateImageStyle);
                styleSelect.addEventListener('change', updateImageStyle);
                radiusInput.addEventListener('input', updateImageStyle);

                // Add resize handles with improved styling
                ['nw', 'ne', 'sw', 'se'].forEach(pos => {
                    const handle = document.createElement('div');
                    handle.className = `resize-handle ${pos}`;
                    wrapper.appendChild(handle);
                    
                    handle.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        handle.classList.add('active');
                        const startX = e.clientX;
                        const startY = e.clientY;
                        const startWidth = img.offsetWidth;
                        const startHeight = img.offsetHeight;
                        const ratio = startWidth / startHeight;
                        
                        function handleResize(moveEvent) {
                            moveEvent.preventDefault();
                            const dx = moveEvent.clientX - startX;
                            const dy = moveEvent.clientY - startY;
                            
                            let newWidth = startWidth;
                            let newHeight = startHeight;
                            
                            if (pos.includes('e')) newWidth = startWidth + dx;
                            if (pos.includes('w')) newWidth = startWidth - dx;
                            if (pos.includes('s')) newHeight = startHeight + dy;
                            if (pos.includes('n')) newHeight = startHeight - dy;
                            
                            if (moveEvent.shiftKey) {
                                if (Math.abs(dx) > Math.abs(dy)) {
                                    newHeight = newWidth / ratio;
                                } else {
                                    newWidth = newHeight * ratio;
                                }
                            }
                            
                            img.style.width = Math.max(50, newWidth) + 'px';
                            img.style.height = Math.max(50, newHeight) + 'px';
                        }
                        
                        function stopResize() {
                            handle.classList.remove('active');
                            document.removeEventListener('mousemove', handleResize);
                            document.removeEventListener('mouseup', stopResize);
                            debouncedSave();
                        }
                        
                        document.addEventListener('mousemove', handleResize);
                        document.addEventListener('mouseup', stopResize);
                    });
                });
            }

            // Remove click handlers when clicking outside images
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.img-wrapper') && !e.target.matches('img')) {
                    const allWrappers = editor.querySelectorAll('.img-wrapper');
                    allWrappers.forEach(wrapper => {
                        const img = wrapper.querySelector('img');
                        if (img) wrapper.replaceWith(img);
                    });
                }
            });

            // // Initialize editor content from localStorage
            // const params = new URLSearchParams(window.location.search);
            // const fileName = params.get('file');
            // if (fileName) {
            //     const files = JSON.parse(localStorage.getItem('odocsFiles')) || [];
            //     const file = files.find(f => f.name === fileName);
            //     if (file) {
            //         editor.innerHTML = file.content || '';
            //         document.getElementById('fileName').value = file.name;
            //     }
            // }

            // Initialize key event handlers
            editor.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) {
                        document.execCommand('redo');
                    } else {
                        document.execCommand('undo');
                    }
                }
            });

            // Add tab/shift+tab handling for text indentation
            editor.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    
                    requestAnimationFrame(() => {
                        const sel = window.getSelection();
                        if (!sel.rangeCount) return;

                        const range = sel.getRangeAt(0);
                        const lines = range.toString().split('\n');

                        // Store selection points
                        const startContainer = range.startContainer;
                        const startOffset = range.startOffset;
                        const endContainer = range.endContainer;
                        const endOffset = range.endOffset;

                        if (lines.length > 1) {
                            // Multiple lines selected
                            const processedLines = lines.map(line => {
                                if (e.shiftKey) {
                                    return line.replace(/^(\t|    )/, '');
                                }
                                return '\t' + line;
                            });

                            const newContent = processedLines.join('\n');
                            
                            // Use document fragment for better performance
                            const fragment = document.createDocumentFragment();
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = newContent;
                            while (tempDiv.firstChild) {
                                fragment.appendChild(tempDiv.firstChild);
                            }

                            range.deleteContents();
                            range.insertNode(fragment);

                            // Restore selection
                            const newRange = document.createRange();
                            newRange.setStart(startContainer, startOffset);
                            newRange.setEnd(endContainer, endOffset);
                            sel.removeAllRanges();
                            sel.addRange(newRange);
                        } else {
                            // Single line handling
                            if (e.shiftKey) {
                                const lineText = range.startContainer.textContent;
                                const indentMatch = /^(\t|    )/.exec(lineText);
                                if (indentMatch) {
                                    range.startContainer.textContent = lineText.substring(indentMatch[0].length);
                                }
                            } else {
                                const tabNode = document.createTextNode('\t');
                                range.insertNode(tabNode);
                                range.setStartAfter(tabNode);
                            }
                        }
                        debouncedSave();
                    });
                }
            });

            // Initialize content change handlers
            editor.addEventListener('input', () => {
                if (window.renderPreview) {
                    window.renderPreview();
                }
                debouncedSave();
            });
        });

        let savedSelection;

        function saveSelection() {
            if (window.getSelection) {
                const sel = window.getSelection();
                if (sel.rangeCount > 0) {
                    savedSelection = sel.getRangeAt(0);
                }
            }
        }

        function restoreSelection() {
            if (savedSelection) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedSelection);
            }
        }

        function applyFormatting(command, value = null) {
            document.execCommand('styleWithCSS', false, true);
            document.execCommand(command, false, value);
            editor.focus();
        }

        function highlightText(color) {
            restoreSelection();
            applyFormatting('hiliteColor', color);
            document.getElementById('highlightDropdown').style.display = 'none';
        }

        function removeHighlight() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            
            requestAnimationFrame(() => {
                document.execCommand('styleWithCSS', false, true);
                document.execCommand('hiliteColor', false, 'transparent');
                editor.focus();
                
                // Cleanup empty spans
                const emptySpans = editor.querySelectorAll('span:empty:not(:contains(\u200B))');
                emptySpans.forEach(span => span.remove());
                
                debouncedSave();
            });
        }

        // Update toggle function
        function toggleHighlightDropdown(e) {
            if (!e) e = window.event;
            e.stopPropagation();
            e.preventDefault();
            const dropdown = document.getElementById('highlightDropdown');
            if (dropdown.style.display === 'grid') {
                dropdown.style.display = 'none';
            } else {
                dropdown.style.display = 'grid';
                saveSelection();
            }
        }

        // Update document click handler
        document.addEventListener('click', function(e) {
            const highlightDropdown = document.getElementById('highlightDropdown');
            const highlightButton = e.target.closest('.highlight');
            const dropdownContent = e.target.closest('.highlight-dropdown-content');
            
            if (!highlightButton && !dropdownContent && highlightDropdown.style.display === 'grid') {
                highlightDropdown.style.display = 'none';
            }
        }, false);

        function formatText(command) {
            restoreSelection();
            document.execCommand('styleWithCSS', false, true);
            document.execCommand(command, false);
            editor.focus();
        }

        // Add debounce function
        function debounce(func, wait) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // Update save indicator functions
        function showSavingProgress(progress) {
            const indicator = document.getElementById('savingIndicator');
            const progressBar = indicator.querySelector('.progress-bar');
            indicator.style.display = 'block';
            progressBar.style.width = `${progress}%`;
        }

        // Update save function
        const debouncedSave = debounce(async function() {
            const fileNameInput = document.getElementById('fileName').value;
            const contentInput = document.getElementById('content').innerHTML;

            if (!fileNameInput || !contentInput) {
                showToast('File name or content is empty!', false);
                return;
            }

            showSavingProgress(0);
            await new Promise(r => setTimeout(r, 100));
            showSavingProgress(30);

            try {
                const files = JSON.parse(localStorage.getItem('odocsFiles')) || [];
                const fileData = {
                    name: fileNameInput,
                    content: contentInput,
                    created: new Date().toISOString()
                };

                showSavingProgress(60);
                await new Promise(r => setTimeout(r, 100));

                const existingFileIndex = files.findIndex(file => file.name === fileNameInput);
                if (existingFileIndex !== -1) {
                    files[existingFileIndex] = fileData;
                } else {
                    files.push(fileData);
                }

                localStorage.setItem('odocsFiles', JSON.stringify(files));
                showSavingProgress(100);
                
                setTimeout(() => {
                    document.getElementById('savingIndicator').style.display = 'none';
                    showToast('✅ File saved successfully!');
                }, 500);
            } catch (error) {
                console.error('Error saving file:', error);
                showToast('⚠ Failed to save file!', false);
                document.getElementById('savingIndicator').style.display = 'none';
            }
        }, 500);

        // Reconfigure event listeners to use debounced save
        document.getElementById('content').addEventListener('input', debouncedSave);
        document.getElementById('fileName').addEventListener('blur', debouncedSave);

        // Show toast notification
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toastNotification');
            toast.innerText = message;
            toast.style.backgroundColor = isSuccess ? '#28a745' : '#dc3545';
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        function cancel() {
            window.location.href = 'file_list.html';
        }

        function changeFontSize(delta) {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            
            requestAnimationFrame(() => {
                const fontSizeInput = document.getElementById('fontSize');
                let currentSize = parseInt(fontSizeInput.value) || 16;
                let newSize = Math.max(8, Math.min(72, currentSize + delta));
                fontSizeInput.value = newSize;

                const range = sel.getRangeAt(0);
                const span = document.createElement('span');
                span.style.fontSize = newSize + 'px';

                // Batch DOM operations
                if (range.collapsed) {
                    span.textContent = '\u200B';
                    range.insertNode(span);
                    range.setStartAfter(span);
                } else {
                    const fragment = document.createDocumentFragment();
                    fragment.appendChild(range.extractContents());
                    span.appendChild(fragment);
                    range.insertNode(span);
                    range.selectNodeContents(span);
                }

                sel.removeAllRanges();
                sel.addRange(range);
                debouncedSave();
            });
        }

        // Update font size monitoring
        function updateFontSizeInput() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const node = sel.anchorNode;
                if (node && node.parentElement) {
                    let currentElement = node.parentElement;
                    while (currentElement && currentElement !== editor) {
                        if (currentElement.style.fontSize) {
                            const size = parseInt(currentElement.style.fontSize);
                            if (!isNaN(size)) {
                                document.getElementById('fontSize').value = size;
                                return;
                            }
                        }
                        currentElement = currentElement.parentElement;
                    }
                }
            }
            document.getElementById('fontSize').value = '16';
        }

        // Add font size persistence between selections
        let lastFontSize = 16;
        editor.addEventListener('mouseup', function() {
            setTimeout(() => {
                const sel = window.getSelection();
                if (sel.rangeCount > 0) {
                    const node = sel.anchorNode;
                    if (node && node.parentElement) {
                        let currentElement = node.parentElement;
                        while (currentElement && currentElement !== editor) {
                            if (currentElement.style.fontSize) {
                                lastFontSize = parseInt(currentElement.style.fontSize);
                                document.getElementById('fontSize').value = lastFontSize;
                                break;
                            }
                        }
                    }
                }
            }, 0);
        });

        // Update initialization code
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            const fileName = params.get('file');
            if (fileName) {
                const files = JSON.parse(localStorage.getItem('odocsFiles')) || [];
                const file = files.find(f => f.name === fileName);
                if (file) {
                    document.getElementById('fileName').value = file.name;
                    const content = document.getElementById('content');
                    content.innerHTML = file.content;
                    
                    // Reset default font size
                    content.style.fontSize = '16px';
                    
                    // Restore individual text node font sizes
                    const elements = content.getElementsByTagName('*');
                    for (let el of elements) {
                        if (el.style.fontSize) {
                            const size = parseInt(el.style.fontSize);
                            if (size > 0) {
                                el.style.fontSize = size + 'px';
                            }
                        }
                    }
                    
                    // Update font size input
                    updateActiveFontSize();
                    
                    setTimeout(renderPreview, 100);
                }
            }
        });

        function updateActiveFontSize() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const node = sel.anchorNode;
                if (node && node.parentElement) {
                    let currentElement = node.parentElement;
                    while (currentElement && currentElement !== editor) {
                        if (currentElement.style.fontSize) {
                            document.getElementById('fontSize').value = parseInt(currentElement.style.fontSize);
                            return;
                        }
                        currentElement = currentElement.parentElement;
                    }
                }
            }
            document.getElementById('fontSize').value = '16';
        }

        // Update font size input when selecting text
        document.getElementById('content').addEventListener('mouseup', updateFontSizeInput);
        document.getElementById('content').addEventListener('keyup', updateFontSizeInput);

        // Close highlight dropdown when clicking outside
        document.addEventListener('click', function (event) {
            const dropdown = document.getElementById('highlightDropdown');
            if (!event.target.matches('.highlight') && !event.target.closest('.highlight-dropdown-content')) {
                dropdown.style.display = 'none';
            }
        });

        // Keep the cursor in the contenteditable div when clicking buttons
        document.querySelectorAll('.toolbar button, .font-size-controls button').forEach(button => {
            button.addEventListener('mousedown', function (event) {
                event.preventDefault(); // Prevent losing focus from contenteditable
                saveSelection(); // Save the selection before performing any action
            });
            button.addEventListener('click', function () {
                restoreSelection(); // Restore the selection after performing the action
            });
        });

        editor.addEventListener('keydown', function(e) {
            // Add proper undo/redo handling
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                    document.execCommand('redo');
                } else {
                    document.execCommand('undo');
                }
                return;
            }
        });

        editor.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z') {
                e.preventDefault();
                document.execCommand('undo', false, null);
            } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'z') {
                e.preventDefault();
                document.execCommand('redo', false, null);
            }
        });
    </script>

    <script src="assets/scripts/font_script.js"></script>
    <script src="assets/scripts/format_controls_system.js"></script>
    <script src="assets/scripts/page_minimap_preview_system.js"></script>
    <script src="assets/scripts/image_handling.js"></script>
    <script>
    // Initialize after all scripts are loaded
    window.addEventListener('load', function() {
        if (window.renderPreview) {
            window.renderPreview();
        }
        
        // Initialize content and editor
        const params = new URLSearchParams(window.location.search);
        const fileName = params.get('file');
        if (fileName) {
            const files = JSON.parse(localStorage.getItem('odocsFiles')) || [];
            const file = files.find(f => f.name === fileName);
            if (file) {
                editor.innerHTML = file.content;
                document.getElementById('fileName').value = file.name;
                if (window.renderPreview) {
                    window.renderPreview();
                }
            }
        }
        
        // Initialize editor events
        editor.addEventListener('input', debouncedSave);
        editor.addEventListener('mouseup', updateFontSizeInput);
        editor.addEventListener('keyup', updateFontSizeInput);
    });
    </script>
