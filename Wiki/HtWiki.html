    <style>
        :root {
            --scrollbar-width: 8px;
            /* default width */
        }

        body {
            margin: 0;
            overflow-y: scroll;
            overflow-x: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        body::-webkit-scrollbar {
            width: var(--scrollbar-width);
            -webkit-transition: width 0.2s ease;
            transition: width 0.2s ease;
        }

        body::-webkit-scrollbar-track {
            background: lightseagreen;
        }

        body::-webkit-scrollbar-thumb {
            background: darkcyan;
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.325);
        }
    </style>
    <script>
        let isWide = false;

        /**
         * @return {boolean}
        */
        // Returns true if the device is in the acceptable category
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        if (isMobile()) {
            console.log("Mobile device");
        } else {
            console.log("Desktop device");
        }

        if (!isMobile()) {
            document.addEventListener('mousemove', (e) => {
                const distanceFromRight = window.innerWidth - e.clientX;

                /**
                * @param {number} width - The number in pixels
                */
                function setScrollbarWidth(width) {
                    document.documentElement.style.setProperty('--scrollbar-width', `${width}px`);
                }

                if (distanceFromRight <= 20 && !isWide) {
                    isWide = true;
                    setScrollbarWidth(12); // 12px
                } else if (distanceFromRight > 30 && isWide) {
                    isWide = false;
                    setScrollbarWidth(8); // 8px
                }
            });
        }
    </script>

        <script name="TruncateTextScript">
            function truncateEllipsis(el, { suffix = '...', minChars = 2 } = {}) {
                const node = typeof el === 'string' ? document.getElementById(el) : el;
                if (!node) return;

                // Always keep the original text stored
                const original = node.getAttribute('data-fulltext') || node.textContent;
                node.setAttribute('data-fulltext', original);

                // Reset before measuring
                node.textContent = original;

                // If it already fits, nothing to do
                if (node.scrollWidth <= node.clientWidth) return;

                // Binary search for the longest substring that fits
                let lo = 0;
                let hi = original.length;
                let best = 0;

                while (lo <= hi) {
                    const mid = (lo + hi) >> 1;
                    node.textContent = original.slice(0, Math.max(mid, minChars)) + suffix;

                    if (node.scrollWidth <= node.clientWidth) {
                        best = mid;      // this length fits
                        lo = mid + 1;    // try longer
                    } else {
                        hi = mid - 1;    // too long, try shorter
                    }
                }

                // Final write with trailing space trimmed
                const finalLen = Math.max(best, minChars);
                let truncated = original.slice(0, finalLen).trimEnd();
                node.textContent = truncated + suffix;

                // Show full text on hover
                node.title = original;
            }
        </script>

        <script>
            // Run once on load
            truncateEllipsis('pageTitle');
            truncateEllipsis('pinnedContentTitle');

            // Re-run automatically if the element resizes
            const titleRo = new ResizeObserver(() => {
                truncateEllipsis('pageTitle');
            });
            const pinnedContentTitleRo = new ResizeObserver(() => {
                truncateEllipsis('pinnedContentTitle');
            });

            titleRo.observe(document.getElementById('pageTitle'));
            pinnedContentTitleRo.observe(document.getElementById('pinnedContentTitle'));
        </script>
