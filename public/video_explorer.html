<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Video Library</title>
        <link rel="stylesheet"
            href="index/assets/stylesheets/video_library_styles/video_player.css" />
    </head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
            margin: 0;
        }
    </style>
    <body>
        <video-explorer>
            <div id="VideoPlayer">
                <video>
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" loading="true"
                        fetchpriority="high" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div id="VideoPlayerControls">
                    <span class="video-player-controls-dock">
                        <button>
                            <svg id="playPauseBtn" width="50" height="50" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" style="cursor: pointer;">
                                <!-- Play icon -->
                                <path id="playIcon"
                                    fill="rgba(0, 238, 255, 0.4)"
                                    stroke="#479dda"
                                    stroke-width="15"
                                    stroke-linejoin="round"
                                    stroke-linecap="round"
                                    transform="translate(300, 300) scale(1.8) translate(-340, -375)"
                                    d="
                                    M 250 270
                                    L 250 480
                                    Q 250 500, 270 490
                                    L 430 385
                                    Q 450 375, 430 365
                                    L 270 260
                                    Q 250 250, 250 270
                                    Z">
                                    <animate
                                        attributeName="opacity"
                                        dur="300ms"
                                        fill="freeze"
                                        begin="indefinite"
                                        id="hidePlay"
                                        to="0" />
                                    <animate
                                        attributeName="opacity"
                                        dur="300ms"
                                        fill="freeze"
                                        begin="indefinite"
                                        id="showPlay"
                                        to="1" />
                                </path>

                                <!-- Pause icon -->
                                <path id="pauseIcon"
                                    opacity="0"
                                    fill="rgba(0, 238, 255, 0.4)"
                                    stroke="#479dda"
                                    stroke-width="15"
                                    stroke-linejoin="round"
                                    stroke-linecap="round"
                                    transform="translate(300, 300) scale(1.8) translate(-340, -375)"
                                    d="
                                    M 260 250
                                    L 260 500
                                    Q 260 510, 270 510
                                    L 320 510
                                    Q 330 510, 330 500
                                    L 330 250
                                    Q 330 240, 320 240
                                    L 270 240
                                    Q 260 240, 260 250
                                    Z
                                    M 370 250
                                    L 370 500
                                    Q 370 510, 380 510
                                    L 430 510
                                    Q 440 510, 440 500
                                    L 440 250
                                    Q 440 240, 430 240
                                    L 380 240
                                    Q 370 240, 370 250
                                    Z">
                                    <animate
                                        attributeName="opacity"
                                        dur="300ms"
                                        fill="freeze"
                                        begin="indefinite"
                                        id="showPause"
                                        to="1" />
                                    <animate
                                        attributeName="opacity"
                                        dur="300ms"
                                        fill="freeze"
                                        begin="indefinite"
                                        id="hidePause"
                                        to="0" />
                                </path>
                            </svg>
                        </button>
                    </span>
                </div>
            </div>
        </video-explorer>
        <script type="text/javascript">
            const svg = document.getElementById('playPauseBtn');
            const hidePlay = document.getElementById('hidePlay');
            const showPlay = document.getElementById('showPlay');
            const showPause = document.getElementById('showPause');
            const hidePause = document.getElementById('hidePause');
            let isPlaying = false;

            svg.addEventListener('click', () => {
                console.log('Clicked! isPlaying:', isPlaying);
                if (isPlaying) {
                    hidePause.beginElement();
                    showPlay.beginElement();
                } else {
                    hidePlay.beginElement();
                    showPause.beginElement();
                }
                isPlaying = !isPlaying;
            });
        </script>
    </body>
</html>
