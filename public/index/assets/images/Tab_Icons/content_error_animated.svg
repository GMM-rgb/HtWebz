<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes bounce {
        0% {
          transform: translateY(0) rotate(-15deg);
        }
        12% {
          transform: translateY(-30px) rotate(-15deg);
        }
        25% {
          transform: translateY(0) rotate(-15deg);
        }
        37% {
          transform: translateY(-20px) rotate(-15deg);
        }
        50% {
          transform: translateY(0) rotate(-15deg);
        }
        62% {
          transform: translateY(-10px) rotate(-15deg);
        }
        75% {
          transform: translateY(0) rotate(-15deg);
        }
        100% {
          transform: translateY(0) rotate(-15deg);
        }
      }
      
      @keyframes squash {
        0% {
          transform: scaleY(1) scaleX(1);
        }
        4% {
          transform: scaleY(0.7) scaleX(1.15);
        }
        8% {
          transform: scaleY(1.3) scaleX(0.85);
        }
        12% {
          transform: scaleY(1) scaleX(1);
        }
        23% {
          transform: scaleY(0.75) scaleX(1.1);
        }
        27% {
          transform: scaleY(1.25) scaleX(0.9);
        }
        37% {
          transform: scaleY(1) scaleX(1);
        }
        48% {
          transform: scaleY(0.8) scaleX(1.08);
        }
        52% {
          transform: scaleY(1.15) scaleX(0.92);
        }
        62% {
          transform: scaleY(1) scaleX(1);
        }
        73% {
          transform: scaleY(0.95) scaleX(1.02);
        }
        77% {
          transform: scaleY(1.05) scaleX(0.98);
        }
        100% {
          transform: scaleY(1) scaleX(1);
        }
      }
      
      @keyframes wiggle {
        0%, 30%, 60%, 100% {
          transform: rotate(0deg);
        }
        18%, 48%, 78% {
          transform: rotate(-5deg);
        }
        22%, 52%, 82% {
          transform: rotate(5deg);
        }
      }
      
      .exclamation-group {
        animation: bounce 3s ease-in-out infinite;
        transform-origin: 100px 100px;
      }
      
      .exclamation-body {
        animation: squash 3s ease-in-out infinite;
        transform-origin: 100px 90px;
      }
      
      .exclamation-wiggle {
        animation: wiggle 3s ease-in-out infinite;
        transform-origin: 100px 90px;
      }
    </style>
  </defs>
  
  <!-- Outer gear teeth -->
  <path d="M 100 5 L 115 20 L 115 35 L 130 35 L 145 20 L 160 35 L 160 50 L 175 65 L 190 65 L 195 75 L 195 90 L 195 110 L 195 125 L 190 135 L 175 135 L 160 150 L 160 165 L 145 180 L 130 165 L 115 165 L 115 180 L 100 195 L 85 180 L 85 165 L 70 165 L 55 180 L 40 165 L 40 150 L 25 135 L 10 135 L 5 125 L 5 110 L 5 90 L 5 75 L 10 65 L 25 65 L 40 50 L 40 35 L 55 20 L 70 35 L 85 35 L 85 20 Z" 
        fill="#479dda" 
        stroke="#0586e3" 
        stroke-width="4"/>
  
  <!-- Inner gear circle -->
  <circle cx="100" cy="100" r="50" fill="#80b5db" stroke="#0586e3" stroke-width="4"/>
  
  <!-- Center hole -->
  <circle cx="100" cy="100" r="25" fill="white" stroke="#0586e3" stroke-width="3"/>
  
  <!-- Crack in gear (zigzag line) -->
  <path d="M 90 20 L 85 45 L 80 40 L 75 65 L 70 60 L 65 85 L 60 80 L 55 105" 
        stroke="#dc3545" 
        stroke-width="5" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Second crack -->
  <path d="M 110 180 L 115 155 L 120 160 L 125 135 L 130 140 L 135 115 L 140 120 L 145 95" 
        stroke="#dc3545" 
        stroke-width="5" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Animated exclamation mark -->
  <g class="exclamation-group">
    <g class="exclamation-wiggle">
      <g class="exclamation-body">
        <!-- Exclamation mark body with curve -->
        <path d="M 108 55 Q 111 70, 110 85 L 107 120 Q 106 127, 100 127 Q 94 127, 93 120 L 90 85 Q 89 70, 92 55 Z" 
              fill="#dc3545" 
              stroke="#c82333" 
              stroke-width="2"/>
        
        <!-- Exclamation mark dot -->
        <circle cx="100" cy="140" r="7" fill="#dc3545" stroke="#c82333" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
