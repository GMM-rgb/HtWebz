<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="FlowChat" />
        <title>FlowChat</title>
        <link rel="icon" href="index/assets/images/Tab_Icons/" type="image/svg+xml" />
        <!-- Stylesheets -->
        <link rel="stylesheet" href="index/assets/stylesheets/top_user_interface.css" />
    </head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: aquamarine;
            overflow-y: auto;
            overflow-x: hidden;
            margin: 0;
        }
    </style>
    <body>
        <section id="topUserInterfaceBar">
            <button id="accountExpandInfo"
                onmouseenter="setupTooltip('#accountExpandInfo', 'Click to see your account options.')" onclick="notify('Under Construction');">
                <img id="accountExpandIcon"
                    src="index/assets/images/load_icon_5649.gif"
                    alt="Error" preload="auto" height="25" width="25" />
            </button>

            <h1 id="pageTitle">FlowChat</h1>

            <a href="/homepage">
                <div id="mainLogo"
                    onmouseenter="setupTooltip('#mainLogo', 'Return to Homepage?')">
                    <img src="index/assets/images/Tab_Icons/Main_Logo_Favicon.svg"
                        alt="HtWebz Logo" width="60" height="60"
                        style="image-rendering: pixelated !important; user-select: none !important;" />
                </div>
            </a>
            
            <script type="text/javascript" src="/socket.io/socket.io.js"></script>
            <script async defer src="index/assets/scripts/account_profiler_client/profiler.js"></script>

            
        </section>

        <script type="text/javascript"
            src="index/assets/scripts/tooltip_system.js" defer></script>
        <script type="text/javascript"
            src="index/assets/scripts/letter_effects.js" defer></script>
    </body>
</html>
