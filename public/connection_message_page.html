<html lang="en-US">
    <head>
        <base href="/" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="FlowChat" />
        <title>FlowChat</title>
        <link rel="icon" href="index/assets/images/Tab_Icons/" type="image/svg+xml" />
        <!-- Stylesheets -->
        <link rel="stylesheet" href="index/assets/stylesheets/top_user_interface.css" />
        <link rel="stylesheet" href="index/assets/stylesheets/content_arrangment.css" />
        <!-- Chat UI Stylesheet Configuration -->
        <link rel="stylesheet" href="index/assets/stylesheets/chat_ui_styles/chat.css" />
        <link rel="stylesheet" href="index/assets/stylesheets/chat_ui_styles/chat_menu.css" />
        <link rel="stylesheet" href="index/assets/stylesheets/chat_ui_styles/chat_box.css" />
        <!-- Base Stylesheet -->
        <link rel="stylesheet" href="index/assets/stylesheets/style_defaults/base_style_reference.css" />
    </head>
    <body>
        <section id="topUserInterfaceBar">
            <button id="accountExpandInfo"
                onmouseenter="setupTooltip('#accountExpandInfo', 'Click to see your account options.')" onclick="notify('Under Construction');">
                <img id="accountExpandIcon"
                    src="index/assets/images/load_icon_5649.gif"
                    alt="Error" preload="auto" height="25" width="25" />
            </button>

            <h1 id="pageTitle">Chat</h1>

            <a href="/homepage">
                <div id="mainLogo"
                    onmouseenter="setupTooltip('#mainLogo', 'Return to Homepage?')">
                    <img src="index/assets/images/Tab_Icons/Main_Logo_Favicon.svg"
                        alt="HtWebz Logo" width="60" height="60"
                        style="image-rendering: pixelated !important; user-select: none !important;" />
                </div>
            </a>
            
            <script type="text/javascript" src="/socket.io/socket.io.js"></script>
            <script type="text/javascript">
                const socket = io();
            </script>
            <script async="true" src="index/assets/scripts/account_profiler_client/profiler.js"></script>
        </section>

        <section id="rootPageSection">
            <div id="ChatFlexContainer">
                <div class="user-chat-menu">
                    <div class="SearchInputContainer">
                        <input type="text" id="SearchUserChat" placeholder="Search..." contextmenu />
                        <button class="InputCancelSearch" id="ChatCancelSearch"><img src="index/assets/images/x-png-35400.png" /></button>
                        <div class="FindChatSearchResults">

                        </div>
                    </div>
                    <div class="chats-list-container">
                        <h3>Recent Chats</h3>

                        <hr />
                    </div>
                </div>
                <!---->
                <div id="ChatBoxContentOverlayArea">
                    <div class="ChatDisplay">
                        
                    </div>
                    <div>
                        <input id="ChatMessageInput" type="text" />
                    </div>
                </div>
            </div>

        </section>

        <script type="text/javascript"
            src="index/assets/scripts/tooltip_system.js" defer></script>
        <script type="text/javascript"
            src="index/assets/scripts/letter_effects.js" defer></script>
        <script type="text/javascript"
            src="index/assets/scripts/info_managment.js" defer></script>
        <script ></script>
    </body>
